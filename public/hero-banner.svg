<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="glow" cx="72%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#5a2a18"/>
      <stop offset="45%" stop-color="#2a130c"/>
      <stop offset="100%" stop-color="#0b0705"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0f0a"/>
      <stop offset="100%" stop-color="#0b0705"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Bridge suggestion (left) -->
  <g stroke="#c99a3b" stroke-opacity="0.28" fill="none" stroke-width="3">
    <path d="M-20 620 L360 470 L740 620"/>
    <path d="M120 470 L120 720 M300 430 L300 720"/>
    <path d="M-20 560 C 180 430, 380 430, 600 560"/>
  </g>
  <g fill="#c99a3b" fill-opacity="0.5">
    <circle cx="80" cy="600" r="3"/><circle cx="170" cy="560" r="3"/>
    <circle cx="260" cy="520" r="3"/><circle cx="350" cy="486" r="3"/>
    <circle cx="440" cy="520" r="3"/><circle cx="530" cy="560" r="3"/>
  </g>

  <!-- Idol silhouette suggestion (right) -->
  <g fill="#3a1c12" fill-opacity="0.9">
    <ellipse cx="1180" cy="470" rx="250" ry="300"/>
    <circle cx="1180" cy="300" r="70"/>
  </g>
  <circle cx="1180" cy="300" r="150" fill="none" stroke="#c99a3b" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Floating diya sparks -->
  <g fill="#e6c893" fill-opacity="0.55">
    <circle cx="900" cy="200" r="2.5"/><circle cx="1020" cy="150" r="2"/>
    <circle cx="820" cy="320" r="2"/><circle cx="1320" cy="260" r="2.5"/>
    <circle cx="1420" cy="420" r="2"/><circle cx="760" cy="520" r="2"/>
